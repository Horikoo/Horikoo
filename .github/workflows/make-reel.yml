name: Make story reel

# Run from your phone or PC: GitHub > Actions > "Make story reel" > "Run workflow".
# When it finishes, download the video from the run's "Artifacts" section.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Story topic (e.g. 슬프고 아름다운 실화). Leave empty to use the sample story."
        required: false
        default: "슬프고 아름다운 실화"
      minutes:
        description: "Length in minutes"
        required: false
        default: "5"
      lang:
        description: "Language: ko / ja / en"
        required: false
        default: "ko"
      voice:
        description: "Voice: ko-female / ko-male / ja-female / ja-male / en-female / en-male"
        required: false
        default: "ko-female"
      split:
        description: "Also cut into parts of N seconds (0 = no split, 90 recommended for Reels)"
        required: false
        default: "0"
  # Uncomment to make one video automatically every Monday & Thursday 09:00 UTC (18:00 KST):
  # schedule:
  #   - cron: "0 9 * * 1,4"

jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: reels-maker
    steps:
      - uses: actions/checkout@v4

      # Fails fast (in a few seconds) with a clear message when the Claude API key is missing,
      # instead of silently making the sample video. Only key NAMES are printed, never values.
      - name: Check API key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          KEY_IN_VARIABLES: ${{ vars.ANTHROPIC_API_KEY != '' }}
          SECRET_NAMES_JSON: ${{ toJSON(secrets) }}
          VARIABLE_NAMES_JSON: ${{ toJSON(vars) }}
          TOPIC: ${{ github.event.inputs.topic || '슬프고 아름다운 실화' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "OK: ANTHROPIC_API_KEY secret found."
            exit 0
          fi
          if [ -z "$TOPIC" ]; then
            echo "No topic given - the sample story will be used (no API key needed)."
            exit 0
          fi
          secret_names=$(echo "$SECRET_NAMES_JSON" | jq -r 'keys | map(select(. != "github_token")) | join(", ")')
          variable_names=$(echo "$VARIABLE_NAMES_JSON" | jq -r 'keys | join(", ")')
          echo "::error title=API 키 없음::ANTHROPIC_API_KEY 가 Repository secret 으로 등록되어 있지 않습니다. Settings > Secrets and variables > Actions > Secrets 탭 > New repository secret 에서 이름을 정확히 ANTHROPIC_API_KEY 로 등록하세요."
          if [ "$KEY_IN_VARIABLES" = "true" ]; then
            echo "::error title=Variables 탭에 등록됨::키가 Secrets 가 아니라 Variables 탭에 저장되어 있습니다. Variables 에서 삭제하고 Secrets 탭에 다시 등록하세요 (Variables 는 공개될 수 있어 위험합니다)."
          fi
          echo "이 저장소에서 보이는 Secret 이름: ${secret_names:-(없음)}"
          echo "이 저장소에서 보이는 Variable 이름: ${variable_names:-(없음)}"
          echo "이름에 오타, 소문자, 띄어쓰기가 있거나 Environment secret 으로 넣었다면 여기 보이지 않습니다."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Make the video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic || '슬프고 아름다운 실화' }}
          MINUTES: ${{ github.event.inputs.minutes || '5' }}
          LANG_CODE: ${{ github.event.inputs.lang || 'ko' }}
          VOICE: ${{ github.event.inputs.voice || 'ko-female' }}
          SPLIT: ${{ github.event.inputs.split || '0' }}
        run: |
          if [ -z "$TOPIC" ]; then
            echo "No topic - using the sample story."
            python make_reel.py --story samples/hachiko_ko.json --split "$SPLIT"
          else
            python make_reel.py --topic "$TOPIC" --minutes "$MINUTES" --lang "$LANG_CODE" \
              --voice "$VOICE" --split "$SPLIT"
          fi

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: reels-maker/output/
          retention-days: 14
