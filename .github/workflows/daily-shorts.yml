name: Daily YouTube Shorts

# Makes a 15-second touching true-story Short and uploads it to YouTube, twice a day.
#   11:47 KST (02:47 UTC)  - lunch time
#   18:47 KST (09:47 UTC)  - evening
# GitHub may start scheduled runs a few minutes late; that is normal.
# You can also run it any time: Actions > "Daily YouTube Shorts" > "Run workflow".
on:
  schedule:
    - cron: "47 2 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional story type (empty = rotates automatically)"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube? (yes / no)"
        required: false
        default: "yes"

permissions:
  contents: write   # to save shorts_history.json (so stories never repeat)

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reels-maker
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_YT: ${{ secrets.YT_CLIENT_ID != '' && secrets.YT_CLIENT_SECRET != '' && secrets.YT_REFRESH_TOKEN != '' }}
        run: |
          if [ "$HAS_CLAUDE" != "true" ]; then
            echo "::error title=API 키 없음::ANTHROPIC_API_KEY 를 Settings > Secrets and variables > Actions > Secrets 에 등록하세요."
            exit 1
          fi
          if [ "$HAS_YT" != "true" ]; then
            echo "::warning title=유튜브 연결 안 됨::YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN 이 없어서 영상만 만들고 업로드는 건너뜁니다. (영상은 Artifacts 에서 다운로드)"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reels-maker/requirements.txt

      - name: Install ffmpeg + Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Make (and upload) the Short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          UPLOAD: ${{ github.event.inputs.upload || 'yes' }}
          LANG_CODE: ${{ vars.SHORTS_LANG || 'ko' }}
          VOICE: ${{ vars.SHORTS_VOICE || '' }}
          PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: |
          args=(--lang "$LANG_CODE" --privacy "$PRIVACY" --topic "$TOPIC")
          [ -n "$VOICE" ] && args+=(--voice "$VOICE")
          [ "$UPLOAD" = "no" ] && args+=(--no-upload)
          python make_short.py "${args[@]}"

      - name: Save story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Shorts history: $(date -u +%F) run ${{ github.run_number }}"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Keep the video as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: reels-maker/output/
          retention-days: 7
          if-no-files-found: ignore
